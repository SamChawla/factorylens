[project]
name = "factorylens"
version = "0.1.0"
description = "Manufacturing pipeline health & data-quality observability, instrumented with OpenTelemetry for SigNoz (Agents of SigNoz hackathon, Track 01)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "typer>=0.12",
    "rich>=13.8",
    "requests>=2.32",
]

[project.scripts]
factorylens = "factorylens.cli:app"

[project.optional-dependencies]
industrial = [
    "asyncua>=2.0.1",
    "paho-mqtt>=2.1.0",
]

[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factorylens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["factorylens"]
# Nothing is omitted, including the CLI — the reported number should be the one
# anyone gets by running the suite, not a flattering subset.

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
