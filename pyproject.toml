[project]
name = "factorylens"
version = "0.1.0"
description = "Manufacturing pipeline health & data-quality observability, instrumented for SigNoz Cloud (Agents of SigNoz hackathon, Track 01)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "typer>=0.12",
    "rich>=13.8",
    "requests>=2.32",
]

[project.scripts]
factorylens = "factorylens.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factorylens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
